<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#142820">
  <title>Pocket Notes</title>
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./icon.svg">
  <link rel="stylesheet" href="./style.css">
  <script type="module" src="./main.js"></script>
</head>
<body>
  <main>
    <h1>Pocket Notes</h1>
    <form id="note-form">
      <label for="note">New note</label>
      <textarea id="note" maxlength="2000" rows="3" required></textarea>
      <button type="submit">Save note</button>
    </form>
    <p id="status" role="status" aria-live="polite"></p>
    <p id="empty">No notes yet.</p>
    <ul id="notes" aria-label="Saved notes"></ul>
    <button id="export" type="button">Export backup</button>
    <label class="import">Import backup<input id="import" type="file" accept="application/json,.json"></label>
  </main>
</body>
</html>
