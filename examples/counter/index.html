<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Counter</title><style>body{margin:0;background:#142820;color:#dcf8ea;font:24px system-ui;display:grid;place-content:center;height:100dvh;text-align:center}button{font:inherit;padding:20px;border:0;border-radius:15px;background:#b8e7d2;color:#142820}</style></head><body><h1>Counter</h1><button id="count"></button><script>let n=Number(localStorage.getItem('count')||0);const button=document.querySelector('button');function draw(){button.textContent='Count: '+n}button.onclick=()=>{localStorage.setItem('count',++n);draw()};draw()</script></body></html>
